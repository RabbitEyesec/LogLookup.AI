# LogLookup AI v2 — example configuration.
# Copy to config.yaml and adjust. API keys come from environment variables
# (${...}) and are NEVER written into this file.
#
# Single-source mode: the `siem:` block below keeps working exactly as before
# and appears in the UI as connection `elastic-default`.
# Multi-source mode: add entries under `sources:`. Credentials for a source are
# never written here - they are stored encrypted by the application (Settings >
# Connections) or injected as LOGLOOKUP_AUTH_<AUTH_PROFILE_ID> (upper-case,
# non-alphanumerics as underscores) for config-file deployments.

app:
  version: '2.0'
  scope_id: org-local              # every record carries this isolation scope

siem:
  type: elastic
  host: https://localhost:9200
  api_key: ${LOGLOOKUP_SIEM_KEY}   # env var, never in file
  alert_index: .alerts-security
  poll_seconds: 60
  severity_floor: medium           # low|medium|high
  verify_tls: true                 # false is lab-only and unsafe
  ca_cert_path: ""                 # private/self-signed CA PEM path

engine:
  mode: local                      # local | server
  server_url: null                 # set if mode: server

correlation:
  window_minutes: 60
  evaluate_every_minutes: 5
  entity_precedence: [process_guid, upn, mac, ip]
  # Out-of-order tolerance: events are correlated only once the watermark
  # (max seen event time minus grace) has passed them.
  watermark_grace_seconds: 60
  # Stale in-memory entity state is flushed after this long without activity.
  entity_retention_minutes: 1440
  # Risk-Based Alerting (RBA): per-alert risk contribution by OCSF severity_id
  # (1=Informational .. 6=Fatal); an attack chain is surfaced when the
  # cumulative risk of any resolved entity in it crosses surface_threshold.
  risk:
    severity_weights:
      0: 0      # Unknown
      1: 1      # Informational
      2: 2      # Low
      3: 4      # Medium
      4: 8      # High
      5: 16     # Critical
      6: 32     # Fatal
    surface_threshold: 10
    # Added per extra independent source provider confirming the same chain.
    independent_source_weight: 4.0
    # A reversed / logically conflicting ATT&CK tactic sequence is downgraded
    # (likely misconfiguration, not an intrusion).
    misconfiguration_downgrade: 0.5

# Deterministic pre-filter: known-benign suppression BEFORE anything reaches
# the AI layer (later phase). Everything here is an explicit allowlist.
prefilter:
  trusted_ips: []                  # exact IPs or CIDRs, e.g. 10.0.0.0/8
  expected_service_accounts: []    # actor user names, e.g. svc-backup
  approved_scanner_hosts: []       # device hostnames, e.g. vuln-scanner-01

ai:
  provider: local                  # local | anthropic | openai
  local_model: foundation-sec-8b
  local_base_url: http://localhost:11434   # Ollama serving endpoint
  cloud_model: null                # default: anthropic=claude-opus-4-8, openai=gpt-5
  cloud_api_key: ${LOGLOOKUP_AI_KEY}
  zero_data_retention: true        # cloud calls are BLOCKED unless acknowledged
  redaction: true                  # tokenize sensitive values before cloud calls
  triage_scope: surfaced           # surfaced | all — which chains the AI triages
  timeout_seconds: 120
  max_retries: 2                   # instructor validation-retry attempts
  max_evidence_chars: 24000        # bound on the evidence payload sent to the AI
  # RAG-grounded MITRE ATT&CK mapping. The knowledge base is built from the
  # official MITRE ATT&CK STIX bundle: python -m engine.ai.kb --build
  rag:
    kb_path: var/attack_kb.json
    index_dir: var/attack_index
    backend: auto                  # vector (FAISS+embeddings) | lexical | auto
    top_k: 8
    embedding_model: sentence-transformers/all-mpnet-base-v2

output:
  results_index: loglookup-results
  dashboard_base_url: http://localhost:8080

# ---------------------------------------------------------------------------
# v2: durable operational store (SQLite WAL, one writer per application home)
# ---------------------------------------------------------------------------
storage:
  driver: sqlite
  db_path: var/loglookup-v2.sqlite3   # relative paths resolve under the app home
  wal: true
  evidence_encryption: true           # raw vendor payloads are always encrypted
  raw_retention_days: 30              # encrypted payloads older than this are dropped; hashes and metadata stay

# ---------------------------------------------------------------------------
# v2: read-only source connections. All start disabled; enable one at a time
# once its auth profile exists. example.invalid is a non-routable placeholder.
# ---------------------------------------------------------------------------
sources:
  - id: elastic-prod
    provider: elastic
    enabled: false
    poll_seconds: 60
    auth_profile_id: elastic-prod-key
    options:
      host: https://elastic.example.invalid:9200
      alert_index: .alerts-security
  - id: sentinel-main
    provider: sentinel                # Azure Monitor Logs query API (KQL)
    enabled: false
    poll_seconds: 90
    lookback_seconds: 300
    auth_profile_id: azure-reader
    options:
      tenant_id: 00000000-0000-0000-0000-000000000000
      workspace_id: 00000000-0000-0000-0000-000000000000
      cloud_environment: public      # public | usgov | china
      enabled_tables: [SecurityAlert]
      max_rows: 500
  - id: splunk-es
    provider: splunk                  # REST search (SPL) with token auth
    enabled: false
    poll_seconds: 90
    auth_profile_id: splunk-reader
    options:
      management_url: https://splunk.example.invalid:8089
      indexes: [notable]             # allowlisted indexes only
      search_mode: jobs              # snapshot search job (the only supported mode)
      # Events whose _time is older than this at collection are excluded. It is
      # reported as EVENT_TIME_FILTER_ACTIVE. 0 = no event-time floor (collect
      # purely by index time; costs more on large indexes).
      max_event_age_seconds: 86400
  - id: defender-xdr
    provider: defender_xdr            # Microsoft Graph Security alerts_v2 + incidents
    enabled: false
    auth_profile_id: graph-reader
    options:
      tenant_id: 00000000-0000-0000-0000-000000000000
      streams: [alerts, incidents]
  - id: entra-id
    provider: entra_id                # sign-ins + directory audits (context only)
    enabled: false
    auth_profile_id: graph-reader
    options:
      tenant_id: 00000000-0000-0000-0000-000000000000
      streams: [signins, directory_audits]

# ---------------------------------------------------------------------------
# v2: outbound response channel. Off by default; nothing is ever dispatched
# without an explicit, recorded approval.
# ---------------------------------------------------------------------------
outputs:
  logic_apps:
    enabled: false
    auth_profile_id: logic-app-dispatch
    allowed_workflows: [notify-soc-v1, create-incident-v1]
    require_explicit_approval: true   # cannot be disabled
    unknown_delivery_policy: reconcile # ambiguous sends are never auto-retried

# Reverse-proxy identity (only peers listed here may assert X-Forwarded-User).
access:
  trusted_proxy_ips: []
